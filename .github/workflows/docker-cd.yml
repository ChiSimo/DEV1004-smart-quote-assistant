name: Docker CD

# Run the workflow whenever code is pushed to main.
on:
  push:
    branches:
      - main

  # Allow the workflow to be started manually from GitHub.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chisimo/dev1004-smart-quote-assistant
  APP_VERSION: 1.0.0
  APP_ENV: production

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Download the repository code onto the GitHub runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Log in to GitHub Container Registry securely.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and publish the production Docker image.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            APP_ENV=${{ env.APP_ENV }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}-${{ env.APP_ENV }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest